# Walker's 1Password mode (prefix "*" in Walker). Needs the 1Password app running and
# Settings → Developer → "Integrate with 1Password CLI" switched on.
# Vault names as shown in 1Password: "Personal" for individual accounts, "Private" for
# family/team accounts. Add any other vaults you want searchable.
vaults = ["Personal"]
clear_after = 5   # seconds until the copied password is cleared from the clipboard
