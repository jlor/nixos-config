# Starship prompt — Catppuccin Mocha
# Two lines: context on top, a clean ❯ to type after.

palette = "catppuccin_mocha"
add_newline = true

format = """
$directory$git_branch$git_status$nix_shell$python$nodejs$rust$golang$c$cmd_duration
$character"""

[directory]
style = "bold mauve"
format = "[ $path]($style)[$read_only]($read_only_style) "
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"

[git_branch]
symbol = " "
style = "bold peach"
format = "[on](overlay0) [$symbol$branch]($style) "

[git_status]
style = "bold yellow"
format = "([$all_status$ahead_behind]($style) )"

[nix_shell]
symbol = " "
style = "bold blue"
format = "[via](overlay0) [$symbol$name]($style) "
heuristic = true

[python]
symbol = " "
style = "bold yellow"
format = "[$symbol$version]($style) "

[nodejs]
symbol = " "
style = "bold green"
format = "[$symbol$version]($style) "

[rust]
symbol = " "
style = "bold peach"
format = "[$symbol$version]($style) "

[golang]
symbol = " "
style = "bold sapphire"
format = "[$symbol$version]($style) "

[c]
symbol = " "
style = "bold blue"
format = "[$symbol$version]($style) "

[cmd_duration]
min_time = 2000
style = "overlay0"
format = "[ $duration]($style)"

[character]
success_symbol = "[❯](bold mauve)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

