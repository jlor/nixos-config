# ~/.config/hypr/hyprlock.conf — Catppuccin Mocha lock screen
# Blurred snapshot of your desktop, big clock, frosted password field.

$font     = JetBrainsMono Nerd Font
$text     = rgba(cdd6f4ff)
$subtext  = rgba(bac2deff)
$mauve    = rgba(cba6f7ff)
$blue     = rgba(89b4faff)
$green    = rgba(a6e3a1ff)
$red      = rgba(f38ba8ff)
$peach    = rgba(fab387ff)

general {
    hide_cursor = true
    # Submit an empty field, so a bare Enter starts PAM and pam_u2f can ask for a
    # YubiKey touch (see check_text below). With this on, there's no way to reach
    # the touch prompt without typing something first.
    ignore_empty_input = false
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 6, easeOutQuint
    animation = fadeOut, 1, 6, easeOutQuint
    animation = inputFieldDots, 1, 2, easeOutQuint
}

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 8
    brightness = 0.55
    vibrancy = 0.2
    noise = 0.012
}

# Clock
label {
    monitor =
    text = $TIME
    color = $text
    font_size = 128
    font_family = $font ExtraBold
    shadow_passes = 2
    shadow_size = 6
    position = 0, 220
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = $subtext
    font_size = 22
    font_family = $font
    position = 0, 110
    halign = center
    valign = center
}

# Password, or a YubiKey touch: press Enter on the empty field and pam_u2f
# (security.nix) takes over.
input-field {
    monitor =
    size = 340, 58
    outline_thickness = 2
    rounding = 29
    inner_color = rgba(1e1e2ecc)
    outer_color = $mauve $blue 45deg
    check_color = $green
    fail_color = $red
    capslock_color = $peach
    font_color = $text
    font_family = $font
    placeholder_text = <span foreground="##7f849c"><i>  Password, or Enter to touch…</i></span>
    # Shown while PAM is authenticating an empty field, i.e. while pam_u2f waits for
    # the touch. A literal string, not $PAMPROMPT: hyprlock only picks up PAM's
    # echo-off prompts there (hardcoded to "Password: "), and pam_u2f's cue arrives
    # as PAM_TEXT_INFO, which hyprlock logs and drops.
    check_text = <i>󰌋  Touch your YubiKey…</i>
    fail_text = <i>$PAMFAIL</i>
    fade_on_empty = false
    dots_spacing = 0.3
    dots_size = 0.25
    position = 0, -40
    halign = center
    valign = center
}

# User
label {
    monitor =
    text = 󰀄  $USER
    color = $subtext
    font_size = 14
    font_family = $font
    position = 0, -110
    halign = center
    valign = center
}
