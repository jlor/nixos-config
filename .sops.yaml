# Who can decrypt the secrets in this repo. Only public keys go here (safe to commit).
# The bootstrap (README → Install) fills these in; on a reinstall it swaps in the new desktop key.
#   jlor:    your personal key, to create and edit secrets
#   desktop: the desktop's own key, so it can decrypt at boot
keys:
  - &jlor age13amcn45a3hjm7vjnu2jllzze4xfmhmlq0kfgtdt43je69nj4wf8qtv4dp6
  - &desktop age168fnrgy36cydf9mnen3kqrlauam04ng3dt9h5rr32wpt3ltdvqusklkpdv

creation_rules:
  - path_regex: secrets/[^/]+\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *jlor
          - *desktop
