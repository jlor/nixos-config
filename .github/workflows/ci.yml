# Checks that the NixOS config and the dev shell templates evaluate.
# Catches broken options, removed/renamed packages and typos before comin
# tries to deploy them. It evaluates rather than builds: a full build of this
# desktop (Nvidia, Steam, CUDA) is too big for a free GitHub runner, and
# evaluation is where almost all config errors show up.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: Evaluate NixOS config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      # hardware-configuration.nix only exists once the PC is installed. Until it's
      # committed, CI uses a stand-in (the real config never sees this file).
      - name: Stand-in hardware config (CI only)
        run: |
          if [ ! -f hardware-configuration.nix ]; then
            echo "::notice::hardware-configuration.nix not committed yet, using ci/hardware-configuration.nix"
            cp ci/hardware-configuration.nix hardware-configuration.nix
            git add hardware-configuration.nix   # flakes only see files known to git
          fi

      - name: Flake check (evaluates the system and home-manager config)
        run: nix flake check --no-build --show-trace

      - name: Evaluate system closure
        run: |
          drv=$(nix eval --raw .#nixosConfigurations.desktop.config.system.build.toplevel.drvPath)
          echo "System derivation: $drv"
          echo "### ✅ desktop evaluates" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$drv\`" >> "$GITHUB_STEP_SUMMARY"

      # Small build: wraps bootstrap.sh and runs shellcheck on it.
      - name: Build bootstrap app (shellcheck)
        run: nix build .#bootstrap --print-build-logs

  # One runner for all five templates: a matrix spent four extra Nix installs and
  # nixpkgs fetches on five evals that take seconds each. The loop keeps the
  # matrix's fail-fast: false semantics — every broken template is reported, not
  # just the first.
  templates:
    name: Dev shell templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Evaluate the dev shell templates
        run: |
          failed=()
          for t in default node java python go; do
            echo "::group::$t"
            nix eval --raw "path:./templates/$t#devShells.x86_64-linux.default.drvPath" || failed+=("$t")
            echo
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::templates failed to evaluate: ${failed[*]}"
            exit 1
          fi

  # A lock file bump says nothing about what it actually moves. This evaluates
  # the package versions on both sides and comments the difference, so a kernel
  # or Nvidia bump is visible before merging deploys it.
  what-changed:
    name: What changed
    runs-on: ubuntu-latest
    # Only for pull requests from this repo: a fork gets a read-only token, so
    # it could evaluate but never post the comment.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
      issues: write # labels are an issues API resource
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so the diff below can resolve the base SHA. The base
          # side of the comparison gets its own checkout further down.
          fetch-depth: 0

      - name: Does this PR touch flake.lock?
        id: lock
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --quiet "$BASE" HEAD -- flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::flake.lock unchanged, nothing to compare"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: cachix/install-nix-action@v31
        if: steps.lock.outputs.changed == 'true'

      - name: Check out the base commit
        if: steps.lock.outputs.changed == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      # Same stand-in as the evaluate job, for both checkouts.
      - name: Stand-in hardware config (CI only)
        if: steps.lock.outputs.changed == 'true'
        run: |
          for dir in . base; do
            if [ ! -f "$dir/hardware-configuration.nix" ]; then
              cp ci/hardware-configuration.nix "$dir/hardware-configuration.nix"
              git -C "$dir" add hardware-configuration.nix
            fi
          done

      - name: Evaluate both sides
        id: report
        if: steps.lock.outputs.changed == 'true'
        run: |
          ci/what-changed.sh "$PWD/base" "$PWD" > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the pull request
        if: steps.lock.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Update the existing comment instead of adding one per push.
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq 'map(select(.body | startswith("<!-- what-changed -->"))) | first | .id // empty')
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@report.md > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@report.md > /dev/null
          fi

      - name: Label the risky ones
        if: steps.lock.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REBOOT: ${{ steps.report.outputs.reboot }}
        run: |
          # --force keeps the label defined here in git rather than clicked into
          # the GitHub UI, and recreates it if it is ever deleted.
          gh label create needs-reboot --color f38ba8 \
            --description "Kernel or Nvidia driver moves; needs a reboot" --force
          if [ "$REBOOT" = "true" ]; then
            gh pr edit "$PR" --add-label needs-reboot
          else
            # Not an error if an earlier push labelled it and this one doesn't.
            gh pr edit "$PR" --remove-label needs-reboot || true
          fi
