# ~/.config/hypr/hyprland.conf — starter config
# Full docs: https://wiki.hypr.land

# Monitors: name, resolution@hz, position, scale[, transform]
# Run `hyprctl monitors` to see your real port names and replace DP-1 / DP-2.
# Left: primary, landscape, highest refresh rate
monitor = DP-1, highrr, 0x0, 1
# Right: portrait. transform 1 = rotated 90° clockwise; use 3 if it's upside down.
monitor = DP-2, preferred, auto-right, 1, transform, 1
# Fallback for any other screen you plug in
monitor = , preferred, auto, 1

# Workspaces 1-5 on the main screen, 6-9 on the vertical one
workspace = 1, monitor:DP-1, default:true
workspace = 2, monitor:DP-1
workspace = 3, monitor:DP-1
workspace = 4, monitor:DP-1
workspace = 5, monitor:DP-1
workspace = 6, monitor:DP-2, default:true
workspace = 7, monitor:DP-2
workspace = 8, monitor:DP-2
workspace = 9, monitor:DP-2

# Start the cursor/focus on the main screen and mark it primary for X11 games,
# so Battle.net and Wine games open on the left monitor.
exec-once = hyprctl dispatch focusmonitor DP-1
exec-once = xrandr --output DP-1 --primary

$terminal = kitty
$menu     = fuzzel
$files    = nautilus
$mod      = SUPER

# Autostart
exec-once = waybar
exec-once = mako
exec-once = hyprpaper
exec-once = hypridle
exec-once = systemctl --user start hyprpolkitagent
exec-once = nm-applet --indicator
exec-once = wl-paste --watch cliphist store

# Nvidia
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct
env = ELECTRON_OZONE_PLATFORM_HINT,auto
cursor {
    no_hardware_cursors = true
}

input {
    kb_layout = dk
    kb_options = ctrl:nocaps   # Caps Lock acts as Ctrl
    follow_mouse = 1
    accel_profile = flat     # raw mouse input for games
    sensitivity = 0
}

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(89b4faee)
    col.inactive_border = rgba(45475aaa)
    layout = dwindle
    allow_tearing = true     # lower latency in fullscreen games
}

decoration {
    rounding = 6
}

misc {
    vrr = 2                  # adaptive sync in fullscreen
    disable_hyprland_logo = true
}

# Let games tear for lower input lag
windowrule = immediate, class:^(steam_app_.*)$

# Keybinds
bind = $mod, Return, exec, $terminal
bind = $mod, D, exec, $menu
bind = $mod, E, exec, $files
bind = $mod, Q, killactive
bind = $mod, F, fullscreen
bind = $mod, V, togglefloating
bind = $mod, L, exec, hyprlock
bind = $mod SHIFT, E, exit
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy

# Focus (arrow keys and vim keys)
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u

# Move windows
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d

# Workspaces 1-9
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

# Mouse: SUPER + drag to move/resize
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Media keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF86AudioPrev, exec, playerctl previous
